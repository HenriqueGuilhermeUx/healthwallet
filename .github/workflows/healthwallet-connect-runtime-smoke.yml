name: HealthWallet Connect Android Runtime Smoke

on:
  push:
    branches:
      - feature/healthwallet-connect
    paths:
      - 'healthwallet-connect/**'
      - '.github/workflows/healthwallet-connect-runtime-smoke.yml'
  workflow_dispatch:

concurrency:
  group: healthwallet-connect-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthwallet-connect

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build Connect web assets
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_HEALTHWALLET_WEB_ORIGIN: https://healthwallet1.netlify.app

      - name: Add and sync Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply Android HealthWallet Connect patches
        run: |
          node scripts/patch-android-sdk.mjs
          node scripts/patch-health-permissions.mjs full
          node scripts/patch-direct-health-reader.mjs
          node scripts/patch-health-permission-launcher.mjs

      - name: Build debug APK
        run: cd android && ./gradlew clean assembleDebug --stacktrace

      - name: Run real Android startup smoke
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: healthwallet-connect
          script: bash scripts/runtime-smoke-android.sh

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthwallet-connect-runtime-smoke-diagnostics
          path: healthwallet-connect/android/runtime-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Upload runtime-tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: healthwallet-connect-runtime-tested-debug-apk
          path: healthwallet-connect/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
