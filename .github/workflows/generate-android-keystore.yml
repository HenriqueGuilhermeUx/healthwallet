name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    name: Generate HealthWallet upload key
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate secrets
        run: |
          if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ]; then echo "ANDROID_KEYSTORE_PASSWORD missing"; exit 1; fi
          if [ -z "${ANDROID_KEY_ALIAS}" ]; then echo "ANDROID_KEY_ALIAS missing"; exit 1; fi
          if [ -z "${ANDROID_KEY_PASSWORD}" ]; then echo "ANDROID_KEY_PASSWORD missing"; exit 1; fi
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Generate keystore and Base64
        run: |
          mkdir -p build/keystore
          keytool -genkeypair -v \
            -keystore build/keystore/healthwallet-release.jks \
            -alias "${ANDROID_KEY_ALIAS}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -keypass "${ANDROID_KEY_PASSWORD}" \
            -dname "CN=HealthWallet, OU=HealthWallet, O=HealthWallet, L=Santos, ST=SP, C=BR"
          base64 -w 0 build/keystore/healthwallet-release.jks > build/keystore/ANDROID_KEYSTORE_BASE64.txt
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthwallet-android-keystore-save-securely
          path: build/keystore/
          retention-days: 7
          if-no-files-found: error
