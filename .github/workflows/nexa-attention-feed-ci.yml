name: Nexa Attention Feed CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'netlify/functions/nexa-attention.mjs'
      - 'netlify/functions/nexa-session.mjs'
      - 'src/hooks/useAuth.tsx'
      - 'src/pages/Login.tsx'
      - 'src/App.tsx'
      - '.env.example'
      - '.github/workflows/nexa-attention-feed-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'feature/nexa-sovereignty')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert strict Nexa integration scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD > /tmp/nexa-changed.txt || true
          cat /tmp/nexa-changed.txt

          while IFS= read -r path; do
            case "$path" in
              .env.example|.github/workflows/nexa-attention-feed-ci.yml|.github/workflows/nexa-ecosystem-health-staging.yml|.github/workflows/nexa-production-deploy.yml|.github/workflows/nexoffice-addon-minimal-ci.yml|netlify/functions/nexa-attention.mjs|netlify/functions/nexa-session.mjs|src/App.tsx|src/hooks/useAuth.tsx|src/pages/Login.tsx)
                ;;
              *)
                echo "Unexpected Health Wallet file changed by Nexa integration: $path"
                exit 1
                ;;
            esac
          done < /tmp/nexa-changed.txt

          grep -q 'path="/concierge/agenda"' src/App.tsx
          grep -q 'path="/concierge/ops"' src/App.tsx
          grep -q 'path="/concierge/requests"' src/App.tsx
          grep -q 'path="/telemedicine"' src/App.tsx
          grep -q 'path="/exams"' src/App.tsx
          grep -q 'path="/medications"' src/App.tsx
          echo 'PASS: current Health Wallet/Concierge surface preserved.'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate serverless syntax
        run: |
          node --check netlify/functions/nexa-attention.mjs
          node --check netlify/functions/nexa-session.mjs

      - name: Assert privacy boundary
        run: |
          set -euo pipefail
          grep -q "read_only_minimum_context" netlify/functions/nexa-attention.mjs
          grep -q "sensitivePayloadIncluded: false" netlify/functions/nexa-attention.mjs
          grep -q "staff/validate-token" netlify/functions/nexa-attention.mjs
          ! grep -q "professional_notes" netlify/functions/nexa-attention.mjs
          ! grep -q "prescription_text" netlify/functions/nexa-attention.mjs
          ! grep -q "reason:" netlify/functions/nexa-attention.mjs
          ! grep -q "ai_analysis" netlify/functions/nexa-attention.mjs
          grep -q "SUPABASE_SECRET_KEY" netlify/functions/nexa-session.mjs
          grep -q "generate_link" netlify/functions/nexa-session.mjs
          grep -q "verifyOtp" src/hooks/useAuth.tsx
          grep -q 'path="/healthwallet"' src/App.tsx
          ! grep -q "healthwallet_nexa_user.*JSON.stringify" src/pages/Login.tsx

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Health Wallet
        run: pnpm build
