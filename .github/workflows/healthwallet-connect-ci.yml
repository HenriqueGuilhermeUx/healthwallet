name: HealthWallet Connect CI

on:
  push:
    branches:
      - feature/healthwallet-connect
    paths:
      - 'healthwallet-connect/**'
      - '.github/workflows/healthwallet-connect-ci.yml'
  pull_request:
    paths:
      - 'healthwallet-connect/**'
      - '.github/workflows/healthwallet-connect-ci.yml'
  workflow_dispatch:

concurrency:
  group: healthwallet-connect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthwallet-connect

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key

      - name: Add Android project
        run: npx cap add android

      - name: Sync Android minimal profile
        run: npm run android:sync:minimal
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key

      - name: Build Android debug
        run: cd android && ./gradlew assembleDebug --stacktrace
