name: HealthWallet Connect CI

on:
  push:
    branches:
      - feature/healthwallet-connect
    paths:
      - 'healthwallet-connect/**'
      - 'src/App.tsx'
      - 'src/pages/DeviceData.tsx'
      - 'src/services/healthWalletConnect.ts'
      - 'scripts/patch-healthwallet-connect-return.mjs'
      - 'supabase/functions/healthwallet-connect-handoff/**'
      - 'SQL_HEALTHWALLET_CONNECT_HANDOFF_V1.sql'
      - 'package.json'
      - '.github/workflows/healthwallet-connect-ci.yml'
  pull_request:
    paths:
      - 'healthwallet-connect/**'
      - 'src/App.tsx'
      - 'src/pages/DeviceData.tsx'
      - 'src/services/healthWalletConnect.ts'
      - 'scripts/patch-healthwallet-connect-return.mjs'
      - 'supabase/functions/healthwallet-connect-handoff/**'
      - 'SQL_HEALTHWALLET_CONNECT_HANDOFF_V1.sql'
      - 'package.json'
      - '.github/workflows/healthwallet-connect-ci.yml'
  workflow_dispatch:

concurrency:
  group: healthwallet-connect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connect-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthwallet-connect

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36"

      - name: Install dependencies
        run: npm install

      - name: Build Connect web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
          VITE_HEALTHWALLET_WEB_ORIGIN: https://healthwallet.example

      - name: Add Android project
        run: npx cap add android

      - name: Sync Android minimal profile
        run: npm run android:sync:minimal
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
          VITE_HEALTHWALLET_WEB_ORIGIN: https://healthwallet.example

      - name: Audit Connect handoff deep link
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q 'android:scheme="healthwallet-connect"' "$MANIFEST" || (echo "healthwallet-connect scheme missing" && exit 1)
          grep -q 'android:host="handoff"' "$MANIFEST" || (echo "handoff host missing" && exit 1)
          echo "Connect deep link audit passed."

      - name: Build Android minimal debug
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Audit minimal merged Health Connect permissions
        shell: bash
        run: |
          MERGED_MANIFEST="$(find android/app/build/intermediates -path '*merged*manifest*' -name AndroidManifest.xml | head -n 1)"
          test -n "$MERGED_MANIFEST" || (echo "Merged AndroidManifest.xml not found" && exit 1)
          echo "Auditing $MERGED_MANIFEST"
          grep -q 'android.permission.health.READ_STEPS' "$MERGED_MANIFEST" || (echo "READ_STEPS missing" && exit 1)
          EXTRA="$(grep -oE 'android\.permission\.health\.[A-Z_]+' "$MERGED_MANIFEST" | sort -u | grep -v '^android.permission.health.READ_STEPS$' || true)"
          if [ -n "$EXTRA" ]; then
            echo "Unexpected Health Connect permissions in minimal build:"
            echo "$EXTRA"
            exit 1
          fi
          echo "Minimal permission audit passed: READ_STEPS only."

      - name: Sync Android full profile
        run: npm run android:sync:full
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
          VITE_HEALTHWALLET_WEB_ORIGIN: https://healthwallet.example

      - name: Build Android full debug
        run: cd android && ./gradlew clean assembleDebug --stacktrace

      - name: Audit full merged Health Connect permissions
        shell: bash
        run: |
          MERGED_MANIFEST="$(find android/app/build/intermediates -path '*merged*manifest*' -name AndroidManifest.xml | head -n 1)"
          test -n "$MERGED_MANIFEST" || (echo "Merged AndroidManifest.xml not found" && exit 1)
          REQUIRED=(
            READ_STEPS
            READ_SLEEP
            READ_HEART_RATE
            READ_RESTING_HEART_RATE
            READ_OXYGEN_SATURATION
            READ_HEART_RATE_VARIABILITY
            READ_BLOOD_PRESSURE
            READ_WEIGHT
            READ_ACTIVE_CALORIES_BURNED
            READ_EXERCISE
            READ_EXERCISE_SESSION
          )
          for PERMISSION in "${REQUIRED[@]}"; do
            grep -q "android.permission.health.${PERMISSION}" "$MERGED_MANIFEST" || (echo "Missing ${PERMISSION} in full build" && exit 1)
          done
          FORBIDDEN="$(grep -oE 'android\.permission\.health\.(WRITE_[A-Z_]+|READ_STEPS_CADENCE|READ_DISTANCE)' "$MERGED_MANIFEST" | sort -u || true)"
          if [ -n "$FORBIDDEN" ]; then
            echo "Forbidden Health Connect permissions found in full build:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "Full permission audit passed."

  healthwallet-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install HealthWallet dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build HealthWallet branch
        run: pnpm exec tsc -b && pnpm exec vite build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key

      - name: Validate return deep-link patch script
        run: node --check scripts/patch-healthwallet-connect-return.mjs
