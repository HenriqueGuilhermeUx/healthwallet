name: iOS TestFlight config gate (read only)

on:
  pull_request:
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'scripts/ios/check-testflight-config.mjs'
      - '.github/workflows/ios-testflight-config-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static iOS configuration checks; no Apple access
        run: node scripts/ios/check-testflight-config.mjs
