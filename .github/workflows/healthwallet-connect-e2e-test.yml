name: HealthWallet Connect E2E Test

on:
  push:
    branches:
      - feature/healthwallet-connect
    paths:
      - 'healthwallet-connect/**'
      - 'src/App.tsx'
      - 'src/pages/DeviceData.tsx'
      - 'src/services/healthWalletConnect.ts'
      - 'scripts/patch-healthwallet-connect-companion-mode.mjs'
      - 'scripts/patch-healthwallet-connect-return.mjs'
      - '.github/workflows/healthwallet-connect-e2e-test.yml'
  workflow_dispatch:

concurrency:
  group: healthwallet-connect-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connect-apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: healthwallet-connect

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 2 -maxdepth 2 -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER" || (echo "Preinstalled sdkmanager not found" && exit 1)
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Check runtime configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing VITE_SUPABASE_URL" && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "Missing VITE_SUPABASE_ANON_KEY" && exit 1)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install Connect dependencies
        run: npm install

      - name: Patch full native Connect flow
        run: |
          node scripts/patch-app-direct-reader.mjs
          node scripts/patch-app-permission-resume.mjs
          node scripts/patch-return-to-healthwallet.mjs

      - name: Build Connect web assets
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_HEALTHWALLET_WEB_ORIGIN: https://healthwallet1.netlify.app

      - name: Generate Connect Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply full native Android bridge and return launcher
        run: |
          node scripts/patch-android-sdk.mjs
          node scripts/patch-health-permissions.mjs full
          node scripts/patch-direct-health-reader.mjs
          node scripts/patch-health-permission-launcher.mjs
          node scripts/patch-return-to-healthwallet.mjs

      - name: Audit Connect E2E native package
        shell: bash
        run: |
          PLUGIN="$(find android/app/src/main/java -name DirectHealthReaderPlugin.java | head -n 1)"
          RETURN_PLUGIN="$(find android/app/src/main/java -name HealthWalletReturnLauncherPlugin.java | head -n 1)"
          test -n "$PLUGIN" || (echo "DirectHealthReaderPlugin missing" && exit 1)
          test -n "$RETURN_PLUGIN" || (echo "HealthWalletReturnLauncherPlugin missing" && exit 1)
          grep -q 'br.com.healthwallet.app.connecttest' "$RETURN_PLUGIN" || (echo "HealthWallet Test target missing" && exit 1)
          grep -q 'br.com.healthwallet.app' "$RETURN_PLUGIN" || (echo "HealthWallet production target missing" && exit 1)
          grep -q 'ExerciseSessionRecord.EXERCISE_DURATION_TOTAL' "$PLUGIN" || (echo "Exercise native reader missing" && exit 1)
          grep -q 'activityMinutes' "$PLUGIN" || (echo "Activity minutes output missing" && exit 1)
          grep -q 'HealthWalletReturnLauncherPlugin.class' "$(find android/app/src/main/java -name MainActivity.java | head -n 1)" || (echo "Return launcher not registered" && exit 1)

      - name: Build Connect E2E debug APK
        run: cd android && ./gradlew clean assembleDebug --stacktrace

      - name: Audit Connect read-only full permissions
        shell: bash
        run: |
          MERGED="$(find android/app/build/intermediates -path '*merged*manifest*' -name AndroidManifest.xml | head -n 1)"
          test -n "$MERGED" || (echo "Merged manifest missing" && exit 1)
          if grep -q 'android.permission.health.WRITE_' "$MERGED"; then
            echo "Forbidden Health Connect write permission found"
            exit 1
          fi
          for P in READ_STEPS READ_SLEEP READ_HEART_RATE READ_RESTING_HEART_RATE READ_OXYGEN_SATURATION READ_HEART_RATE_VARIABILITY READ_BLOOD_PRESSURE READ_WEIGHT READ_ACTIVE_CALORIES_BURNED READ_EXERCISE; do
            grep -q "android.permission.health.$P" "$MERGED" || (echo "Missing $P" && exit 1)
          done

      - name: Upload Connect E2E APK
        uses: actions/upload-artifact@v4
        with:
          name: healthwallet-connect-e2e-debug-apk
          path: healthwallet-connect/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  healthwallet-test-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 2 -maxdepth 2 -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER" || (echo "Preinstalled sdkmanager not found" && exit 1)
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Check runtime configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing VITE_SUPABASE_URL" && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "Missing VITE_SUPABASE_ANON_KEY" && exit 1)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install HealthWallet dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Patch companion-mode Device Data screen
        run: node scripts/patch-healthwallet-connect-companion-mode.mjs

      - name: Audit companion-mode source
        shell: bash
        run: |
          grep -q 'managedByConnect: true' src/pages/DeviceData.tsx || (echo "Connect availability bypass missing" && exit 1)
          grep -q 'Atualizar pelo Connect' src/pages/DeviceData.tsx || (echo "Connect refresh routing missing" && exit 1)
          grep -q '!connectManaged && !nativeAvailability?.available' src/pages/DeviceData.tsx || (echo "False timeout suppression missing" && exit 1)

      - name: Build HealthWallet Test web app
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_NEXA_LOGIN: 'false'

      - name: Generate HealthWallet Test Android project
        run: |
          HEALTHWALLET_TEST_VARIANT=true npx cap add android
          HEALTHWALLET_TEST_VARIANT=true npx cap sync android

      - name: Patch HealthWallet Test Android bridge
        run: |
          node scripts/patch-capacitor-android.mjs
          node scripts/patch-health-permissions.mjs
          node scripts/patch-healthwallet-connect-return.mjs

      - name: Audit HealthWallet Test identity and return deep link
        shell: bash
        run: |
          GRADLE="android/app/build.gradle"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q 'br.com.healthwallet.app.connecttest' "$GRADLE" || (echo "HealthWallet Test application id missing" && exit 1)
          grep -q 'android:scheme="healthwallet" android:host="connect-complete"' "$MANIFEST" || (echo "Connect return deep link missing" && exit 1)
          grep -q '<data android:scheme="healthwallet-connect" />' "$MANIFEST" || (echo "Connect package query missing" && exit 1)

      - name: Build HealthWallet Test debug APK
        run: cd android && ./gradlew clean assembleDebug --stacktrace

      - name: Audit HealthWallet main permissions remain minimal
        shell: bash
        run: |
          MERGED="$(find android/app/build/intermediates -path '*merged*manifest*' -name AndroidManifest.xml | head -n 1)"
          test -n "$MERGED" || (echo "Merged manifest missing" && exit 1)
          grep -q 'android.permission.health.READ_STEPS' "$MERGED" || (echo "READ_STEPS missing" && exit 1)
          EXTRA="$(grep -oE 'android\.permission\.health\.[A-Z_]+' "$MERGED" | sort -u | grep -v '^android.permission.health.READ_STEPS$' || true)"
          if [ -n "$EXTRA" ]; then
            echo "Unexpected Health Connect permissions in HealthWallet Test:"
            echo "$EXTRA"
            exit 1
          fi

      - name: Upload HealthWallet Test APK
        uses: actions/upload-artifact@v4
        with:
          name: healthwallet-test-connect-companion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
