name: HealthWallet Connect Diagnostic APK

on:
  push:
    branches:
      - feature/healthwallet-connect
    paths:
      - 'healthwallet-connect/src/App.tsx'
      - 'healthwallet-connect/src/services/healthSync.ts'
      - 'healthwallet-connect/scripts/patch-health-diagnostics-v7.mjs'
      - '.github/workflows/healthwallet-connect-diagnostic.yml'
  workflow_dispatch:

concurrency:
  group: healthwallet-connect-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-diagnostic-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthwallet-connect

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36"

      - name: Check runtime configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing VITE_SUPABASE_URL" && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "Missing VITE_SUPABASE_ANON_KEY" && exit 1)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install dependencies and base Health Connect patches
        run: npm install

      - name: Add native diagnostic bridge
        run: node scripts/patch-health-diagnostics-v7.mjs

      - name: Audit diagnostic bridge source
        shell: bash
        run: |
          PLUGIN="node_modules/@capgo/capacitor-health/android/src/main/java/app/capgo/plugin/health/HealthPlugin.kt"
          grep -q 'fun getHealthConnectDiagnostics' "$PLUGIN" || (echo "Diagnostic method missing" && exit 1)
          grep -q 'fun openHealthPermissions' "$PLUGIN" || (echo "Direct permissions method missing" && exit 1)
          grep -q 'android.health.connect.action.MANAGE_HEALTH_PERMISSIONS' "$PLUGIN" || (echo "Health permissions intent missing" && exit 1)
          echo "Native diagnostic bridge audit passed."

      - name: Build Connect web assets
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_HEALTHWALLET_WEB_ORIGIN: https://healthwallet1.netlify.app

      - name: Add Android project
        run: npx cap add android

      - name: Sync Android full profile without rebuilding web
        run: |
          npx cap sync android
          node scripts/patch-android-sdk.mjs
          node scripts/patch-health-permissions.mjs full

      - name: Build Android diagnostic debug
        run: cd android && ./gradlew clean assembleDebug --stacktrace

      - name: Audit merged Health Connect permissions
        shell: bash
        run: |
          MERGED_MANIFEST="$(find android/app/build/intermediates -path '*merged*manifest*' -name AndroidManifest.xml | head -n 1)"
          test -n "$MERGED_MANIFEST" || (echo "Merged AndroidManifest.xml not found" && exit 1)
          REQUIRED=(
            READ_STEPS
            READ_SLEEP
            READ_HEART_RATE
            READ_RESTING_HEART_RATE
            READ_OXYGEN_SATURATION
            READ_HEART_RATE_VARIABILITY
            READ_BLOOD_PRESSURE
            READ_WEIGHT
            READ_ACTIVE_CALORIES_BURNED
            READ_EXERCISE
          )
          for PERMISSION in "${REQUIRED[@]}"; do
            grep -q "android.permission.health.${PERMISSION}" "$MERGED_MANIFEST" || (echo "Missing ${PERMISSION}" && exit 1)
          done
          grep -q 'androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE' "$MERGED_MANIFEST" || (echo "Rationale activity missing" && exit 1)
          grep -q 'android.intent.action.VIEW_PERMISSION_USAGE' "$MERGED_MANIFEST" || (echo "Permission usage alias missing" && exit 1)
          echo "Diagnostic APK manifest audit passed."

      - name: Upload HealthWallet Connect diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: healthwallet-connect-diagnostic-debug-apk
          path: healthwallet-connect/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
