name: iOS simulator preflight (unsigned)

on:
  pull_request:
    paths:
      - 'scripts/prepare-ios.mjs'
      - 'docs/ios/**'
      - '.github/workflows/ios-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install project dependencies without modifying lockfiles
        run: pnpm install --no-frozen-lockfile
      - name: Build health wallet web bundle before temporary native dependency
        run: pnpm build:prod
      - name: Add matching Capacitor iOS dependency in ephemeral runner
        run: pnpm add @capacitor/ios@7.4.3
      - name: Prepare iOS platform
        env:
          IOS_WEB_BUILD_READY: '1'
        run: node scripts/prepare-ios.mjs
      - name: Build unsigned iOS simulator application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/ios-derived" build 2>&1 | tee ios-preflight-build.log
      - name: Archive unsigned simulator .app for QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/ios-derived/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostic build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-preflight-log
          path: ios-preflight-build.log
          if-no-files-found: ignore
          retention-days: 7
