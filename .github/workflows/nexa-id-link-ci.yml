name: Nexa ID Account Link CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'netlify/functions/nexa-session.mjs'
      - 'src/hooks/useAuth.tsx'
      - 'src/pages/Login.tsx'
      - '.github/workflows/nexa-id-link-ci.yml'
      - 'netlify.toml'
      - 'index.html'
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Validate Nexa ID link boundary
        run: |
          set -euo pipefail
          grep -q "account_link_required" netlify/functions/nexa-session.mjs
          grep -q "validateCurrentHealthSession" netlify/functions/nexa-session.mjs
          grep -q "healthwallet_pending_nexa_token" src/hooks/useAuth.tsx
          grep -q "Vincular ao seu Nexa ID" src/pages/Login.tsx
          ! grep -q "SUPABASE_SECRET_KEY.*Bearer" netlify/functions/nexa-session.mjs

      - name: Deploy prebuilt PWA preview
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'pwa-rollout-') }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 6385fa98-ad7a-4fd2-8cfa-5d903f437502
        run: |
          set -euo pipefail
          npx --yes netlify-cli@27.8.0 deploy             --dir dist             --functions netlify/functions             --alias healthwallet-pwa-pr10             --site "$NETLIFY_SITE_ID"             --auth "$NETLIFY_AUTH_TOKEN"             --message "HealthWallet PWA preview ${GITHUB_SHA}"
