name: Gate C Netlify Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY GATE C FRONTEND to publish the transition-safe sharing UI'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/gate-c-netlify-deploy-trigger.txt'

permissions:
  contents: read

concurrency:
  group: gate-c-netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy transition-safe sharing UI
    if: ${{ github.event_name == 'push' || github.event.inputs.confirmation == 'DEPLOY GATE C FRONTEND' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      NETLIFY_SITE_ID: 6385fa98-ad7a-4fd2-8cfa-5d903f437502
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN || secrets.NETLIFY_ACCESS_TOKEN || secrets.NETLIFY_API_TOKEN }}
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4

      - name: Detect deployment authorization
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo 'armed=true' >> "$GITHUB_OUTPUT"
            echo 'Manual Gate C production deploy authorization accepted.'
            exit 0
          fi

          trigger='.github/gate-c-netlify-deploy-trigger.txt'
          if [ "$(head -n 1 "$trigger")" = 'DEPLOY GATE C FRONTEND' ] && grep -Eq '^request_id=.+$' "$trigger"; then
            echo 'armed=true' >> "$GITHUB_OUTPUT"
            echo 'Dedicated Gate C production deploy trigger accepted.'
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
            echo 'Gate C production deploy trigger is disarmed; no deployment will run.'
          fi

      - name: Setup Node
        if: ${{ steps.gate.outputs.armed == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        if: ${{ steps.gate.outputs.armed == 'true' }}
        run: corepack enable

      - name: Install dependencies
        if: ${{ steps.gate.outputs.armed == 'true' }}
        run: pnpm install --no-frozen-lockfile

      - name: Verify transition-safe source
        if: ${{ steps.gate.outputs.armed == 'true' }}
        run: |
          set -euo pipefail
          grep -q "create_health_access_code" src/pages/ShareQRCode.tsx
          ! grep -q "Math.random" src/pages/ShareQRCode.tsx
          ! grep -Eq "from\('access_codes'\).*insert|\.from\('access_codes'\)[[:space:]]*\.insert" src/pages/ShareQRCode.tsx
          grep -q "HW-\[0-9A-F\]" src/pages/AccessCode.tsx
          grep -q "Compartilhamento antigo desativado" src/pages/AccessCode.tsx

      - name: Build application
        if: ${{ steps.gate.outputs.armed == 'true' }}
        run: pnpm build

      - name: Require Netlify credential
        if: ${{ steps.gate.outputs.armed == 'true' }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "NETLIFY_AUTH_TOKEN is not configured in GitHub Actions secrets."
            exit 2
          fi

      - name: Deploy production to Netlify
        if: ${{ steps.gate.outputs.armed == 'true' }}
        id: netlify
        run: |
          set -euo pipefail
          npx -y netlify-cli@latest deploy \
            --build \
            --prod \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "Gate C transition-safe secure sharing frontend ${GITHUB_SHA}" \
            --json > netlify-deploy.json
          cat netlify-deploy.json
          DEPLOY_URL="$(jq -r '.deploy_url // .deploy_ssl_url // empty' netlify-deploy.json)"
          PROD_URL="$(jq -r '.url // empty' netlify-deploy.json)"
          test -n "$DEPLOY_URL"
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "prod_url=$PROD_URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployed site is reachable
        if: ${{ steps.gate.outputs.armed == 'true' }}
        run: |
          set -euo pipefail
          URL='${{ steps.netlify.outputs.deploy_url }}'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$URL" >/tmp/healthwallet-index.html
          grep -qi '<div id="root"' /tmp/healthwallet-index.html
          echo "Gate C transition-safe frontend is reachable at $URL"

      - name: Confirm disarmed no-op
        if: ${{ steps.gate.outputs.armed != 'true' }}
        run: echo 'Gate C deployment is safely disarmed; no build or production deploy was executed.'
