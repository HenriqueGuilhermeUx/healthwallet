name: Health Concierge CI

on:
  push:
    branches:
      - feature/health-concierge-mvp
    paths:
      - 'src/pages/Concierge*.tsx'
      - 'src/components/Concierge*.tsx'
      - 'src/services/concierge*.ts'
      - 'netlify/functions/concierge-ai-assist.js'
      - 'src/App.tsx'
      - 'src/components/BottomNav.tsx'
      - 'SQL_CONCIERGE_*.sql'
      - 'HEALTH_CONCIERGE_MVP.md'
      - 'HEALTH_CONCIERGE_VALIDATION.md'
      - '.github/workflows/health-concierge-ci.yml'
  workflow_dispatch:

jobs:
  concierge-build:
    name: Build HealthWallet Concierge branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: TypeScript and Vite build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key-for-static-build-only

      - name: Concierge route audit
        run: |
          grep -q 'path="/concierge/consent"' src/App.tsx
          grep -q 'path="/concierge"' src/App.tsx
          grep -q 'path="/concierge/health"' src/App.tsx
          grep -q 'path="/concierge/request"' src/App.tsx
          grep -q 'path="/concierge/requests/:id"' src/App.tsx
          grep -q 'path="/concierge/plan"' src/App.tsx
          grep -q 'path="/concierge/programs"' src/App.tsx
          grep -q 'path="/concierge/team"' src/App.tsx
          grep -q 'path="/concierge/agenda"' src/App.tsx
          grep -q 'path="/concierge/ops"' src/App.tsx
          grep -q 'path="/concierge/ops/case/:id"' src/App.tsx
          grep -q 'path="/concierge/ops/pilot"' src/App.tsx
          grep -q 'path="/concierge/ops/roster"' src/App.tsx
          grep -q 'ConciergeAccessGate' src/App.tsx

      - name: Concierge migration inventory
        run: |
          test -f SQL_CONCIERGE_MVP_V1.sql
          test -f SQL_CONCIERGE_PILOT_ANALYTICS_V1.sql
          test -f SQL_CONCIERGE_AUTOMATION_GUARDS_V1.sql
          test -f SQL_CONCIERGE_CONSENT_V1.sql
          test -f SQL_CONCIERGE_ROSTER_GUARDS_V1.sql
          test -f SQL_CONCIERGE_REQUEST_INTEGRITY_V1.sql
          test -f SQL_CONCIERGE_PROGRAM_GUARDS_V1.sql
          test -f SQL_CONCIERGE_ALERT_ENGINE_V1.sql
          test -f SQL_CONCIERGE_ALERT_CONSENT_GUARD_V1.sql
          test -f SQL_CONCIERGE_CLINICAL_REVIEW_V1.sql
          test -f SQL_CONCIERGE_REQUEST_CONTEXT_V1.sql
          test -f SQL_CONCIERGE_PATIENT_AUDIT_V1.sql
          test -f SQL_CONCIERGE_SLA_METRICS_V1.sql
          test -f SQL_CONCIERGE_PATIENT_REPLY_ROUTING_V1.sql
          test -f HEALTH_CONCIERGE_VALIDATION.md

      - name: SQL safety audit
        run: |
          grep -q 'ALTER TABLE public.concierge_requests ENABLE ROW LEVEL SECURITY' SQL_CONCIERGE_MVP_V1.sql
          grep -q 'patient_id = auth.uid()' SQL_CONCIERGE_MVP_V1.sql
          grep -q 'ALTER TABLE public.concierge_work_logs ENABLE ROW LEVEL SECURITY' SQL_CONCIERGE_PILOT_ANALYTICS_V1.sql
          grep -q 'public.concierge_can_access_request' SQL_CONCIERGE_AUTOMATION_GUARDS_V1.sql
          grep -q 'public.concierge_has_active_consent' SQL_CONCIERGE_CONSENT_V1.sql
          grep -q 'concierge_accept_consent' SQL_CONCIERGE_CONSENT_V1.sql
          grep -q 'concierge_revoke_consent' SQL_CONCIERGE_CONSENT_V1.sql
          grep -q 'concierge_set_primary_assignment' SQL_CONCIERGE_ROSTER_GUARDS_V1.sql
          grep -q 'concierge_guard_request_update' SQL_CONCIERGE_REQUEST_INTEGRITY_V1.sql
          grep -q 'Patient-authored request content is immutable' SQL_CONCIERGE_REQUEST_INTEGRITY_V1.sql
          grep -q "enrollment_mode IN ('self','team')" SQL_CONCIERGE_PROGRAM_GUARDS_V1.sql
          grep -q 'concierge_guard_alert_consent' SQL_CONCIERGE_ALERT_CONSENT_GUARD_V1.sql
          grep -q 'concierge_close_alerts_on_consent_revocation' SQL_CONCIERGE_ALERT_CONSENT_GUARD_V1.sql
          grep -q 'concierge_guard_clinical_review' SQL_CONCIERGE_CLINICAL_REVIEW_V1.sql
          grep -q 'concierge_get_request_context' SQL_CONCIERGE_REQUEST_CONTEXT_V1.sql
          grep -q 'concierge_context_access_logs' SQL_CONCIERGE_REQUEST_CONTEXT_V1.sql
          grep -q 'concierge_list_my_context_accesses' SQL_CONCIERGE_PATIENT_AUDIT_V1.sql
          grep -q 'concierge_capture_first_response_on_request_update' SQL_CONCIERGE_SLA_METRICS_V1.sql
          grep -q 'concierge_capture_first_response_on_staff_event' SQL_CONCIERGE_SLA_METRICS_V1.sql
          grep -q 'concierge_patient_reply' SQL_CONCIERGE_PATIENT_REPLY_ROUTING_V1.sql
          grep -q "OLD.status = 'waiting_patient'" SQL_CONCIERGE_PATIENT_REPLY_ROUTING_V1.sql
          grep -q 'Active Concierge consent required' SQL_CONCIERGE_PATIENT_REPLY_ROUTING_V1.sql
          if grep -Eq 'USING \(true\)|WITH CHECK \(true\)' SQL_CONCIERGE_*.sql; then
            echo 'Unsafe unrestricted RLS policy found in Concierge migrations'
            exit 1
          fi

      - name: Consent and context audit
        run: |
          grep -q 'consent_status' src/pages/ConciergeConsent.tsx
          grep -q 'Revogar acesso' src/pages/ConciergeConsent.tsx
          grep -q 'Quem acessou meu contexto' src/pages/ConciergeConsent.tsx
          grep -q 'membership.consent_status' src/components/ConciergeAccessGate.tsx
          grep -q 'Carregar contexto autorizado' src/components/ConciergeAuthorizedContextPanel.tsx
          grep -q 'subjectFamilyMemberId' src/pages/ConciergeRequest.tsx
          grep -q 'linked_exams' src/pages/ConciergeRequest.tsx
          grep -q "program.enrollment_mode === 'team'" src/pages/ConciergePrograms.tsx
          grep -q 'concierge_list_my_context_accesses' src/services/conciergeConsent.ts
          if grep -Eq "file_url.*ConciergeAuthorizedContextPanel|file_url.*conciergeContext" src/components/ConciergeAuthorizedContextPanel.tsx src/services/conciergeContext.ts; then
            echo 'Raw file URL leaked into Concierge context UI/service'
            exit 1
          fi

      - name: Messaging routing audit
        run: |
          test -f src/services/conciergeMessaging.ts
          grep -q 'concierge_patient_reply' src/services/conciergeMessaging.ts
          grep -q 'sendConciergePatientReply' src/pages/ConciergeRequestDetail.tsx
          grep -q 'caso volta automaticamente' src/pages/ConciergeRequestDetail.tsx

      - name: Pilot economics audit
        run: |
          grep -q 'planSegments' src/services/conciergeAnalytics.ts
          grep -q 'humanMinutesPerPatient' src/services/conciergeAnalytics.ts
          grep -q 'doctorMinutesPerPatient' src/services/conciergeAnalytics.ts
          grep -q 'repeatRate' src/services/conciergeAnalytics.ts
          grep -q 'Com plano × sem plano' src/pages/ConciergePilotDashboard.tsx

      - name: Dormant AI assist safety audit
        run: |
          test -f netlify/functions/concierge-ai-assist.js
          test -f src/services/conciergeAI.ts
          node --check netlify/functions/concierge-ai-assist.js
          grep -Fq "consent_scope?.ai_assist === true" netlify/functions/concierge-ai-assist.js
          grep -Fq "AI_ASSIST_CONSENT_REQUIRED" netlify/functions/concierge-ai-assist.js
          grep -Fq "store: false" netlify/functions/concierge-ai-assist.js
          grep -Fq "visibility: 'staff_only'" netlify/functions/concierge-ai-assist.js
          grep -Fq "autonomous_action: false" netlify/functions/concierge-ai-assist.js
          if grep -R "OPENAI_API_KEY" src/services/concierge*.ts src/pages/Concierge*.tsx src/components/Concierge*.tsx; then
            echo 'OPENAI_API_KEY must remain server-side only in Concierge code'
            exit 1
          fi
          if grep -Eq "method: ['\"]PATCH['\"]|method: ['\"]DELETE['\"]" netlify/functions/concierge-ai-assist.js; then
            echo 'AI assist must not mutate or delete clinical workflow records'
            exit 1
          fi

      - name: Patient safety audit
        run: |
          grep -q 'Concierge não é serviço de emergência' src/pages/ConciergeRequest.tsx
          grep -q 'Procure atendimento de urgência imediatamente' src/pages/ConciergeRequest.tsx
          grep -q 'não substitui revisão clínica' src/pages/ConciergeCase.tsx
          grep -q 'A publicação da revisão requer médico responsável' src/components/ConciergeClinicalReviewPanel.tsx
          grep -q 'não geram diagnóstico automático' src/pages/ConciergeHealth.tsx

      - name: Health Connect regression guard
        run: |
          echo 'Concierge CI must not alter HealthWallet Connect permission architecture.'
          git diff HEAD^ -- . ':!src/pages/Concierge*' ':!src/components/Concierge*' ':!src/services/concierge*' ':!netlify/functions/concierge-ai-assist.js' ':!src/App.tsx' ':!src/components/BottomNav.tsx' ':!SQL_CONCIERGE_*.sql' ':!HEALTH_CONCIERGE_*.md' > /tmp/non_concierge.diff || true
          if grep -E 'READ_(SLEEP|HEART_RATE|RESTING_HEART_RATE|OXYGEN_SATURATION|HEART_RATE_VARIABILITY|BLOOD_PRESSURE|WEIGHT|ACTIVE_CALORIES_BURNED|EXERCISE)' /tmp/non_concierge.diff; then
            echo 'Unexpected Health Connect permission change outside Concierge scope'
            exit 1
          fi

      - name: Validation-only guard
        run: |
          echo 'Health Concierge CI only compiles and audits source files.'
          echo 'Database migration and site/app publication remain manual release gates.'
