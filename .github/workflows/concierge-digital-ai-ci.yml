name: Concierge Digital AI CI

on:
  push:
    branches:
      - feature/concierge-digital-ai-v1
  pull_request:
    paths:
      - 'SQL_CONCIERGE_DIGITAL_AI_V1.sql'
      - 'netlify/functions/concierge-digital-ai.js'
      - 'src/pages/ConciergeDigital.tsx'
      - 'src/pages/Concierge.tsx'
      - 'src/App.tsx'
      - '.github/workflows/concierge-digital-ai-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Concierge Digital build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'path="/concierge/digital"' src/App.tsx
          grep -q 'concierge_chat_sessions' SQL_CONCIERGE_DIGITAL_AI_V1.sql
          grep -q 'concierge_chat_request_human' SQL_CONCIERGE_DIGITAL_AI_V1.sql
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' netlify/functions/concierge-digital-ai.js
          grep -q 'gpt-6-luna' netlify/functions/concierge-digital-ai.js
          grep -q 'Falar com uma pessoa' src/pages/ConciergeDigital.tsx

      - name: Build
        run: pnpm build

      - name: Netlify hosted build config diagnostics
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 6385fa98-ad7a-4fd2-8cfa-5d903f437502
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}" || { echo 'NETLIFY_AUTH_TOKEN unavailable'; exit 2; }

          node <<'NODE'
          const token = process.env.NETLIFY_AUTH_TOKEN
          const siteId = process.env.NETLIFY_SITE_ID
          const response = await fetch(`https://api.netlify.com/api/v1/sites/${siteId}`, {
            headers: { Authorization: `Bearer ${token}` },
          })
          if (!response.ok) throw new Error(`Netlify site API failed: ${response.status}`)
          const site = await response.json()
          const build = site.build_settings || {}
          const safe = {
            site_name: site.name,
            repo_branch: build.repo_branch || null,
            build_command: build.cmd || null,
            base: build.base || null,
            publish: build.dir || null,
            functions_dir: build.functions_dir || null,
            provider: build.provider || null,
            stop_builds: build.stop_builds ?? null,
            framework: build.framework || null,
          }
          console.log('NETLIFY_SAFE_SITE_CONFIG=' + JSON.stringify(safe))
          NODE

          for key in PNPM_FLAGS NODE_VERSION NPM_FLAGS NPM_VERSION YARN_FLAGS; do
            printf '%s(deploy-preview,builds)=' "$key"
            npx --yes netlify-cli@27.8.0 env:get "$key" --context deploy-preview --scope builds 2>/dev/null || true
          done

          echo '--- effective deploy-preview build stages ---'
          npx --yes netlify-cli@27.8.0 build --dry --context deploy-preview

      - name: Netlify parity build
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 6385fa98-ad7a-4fd2-8cfa-5d903f437502
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}" || { echo 'NETLIFY_AUTH_TOKEN unavailable'; exit 2; }
          npx --yes netlify-cli@27.8.0 build --context deploy-preview
