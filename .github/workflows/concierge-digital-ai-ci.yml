name: Concierge Digital AI CI

on:
  push:
    branches:
      - feature/concierge-digital-ai-v1
  pull_request:
    paths:
      - 'SQL_CONCIERGE_DIGITAL_AI_V1.sql'
      - 'netlify/functions/concierge-digital-ai.js'
      - 'src/pages/ConciergeDigital.tsx'
      - 'src/pages/Concierge.tsx'
      - 'src/App.tsx'
      - '.github/workflows/concierge-digital-ai-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Concierge Digital build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'path="/concierge/digital"' src/App.tsx
          grep -q 'concierge_chat_sessions' SQL_CONCIERGE_DIGITAL_AI_V1.sql
          grep -q 'concierge_chat_request_human' SQL_CONCIERGE_DIGITAL_AI_V1.sql
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' netlify/functions/concierge-digital-ai.js
          grep -q 'gpt-6-luna' netlify/functions/concierge-digital-ai.js
          grep -q 'Falar com uma pessoa' src/pages/ConciergeDigital.tsx

      - name: Read failed hosted Netlify deploy log
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 6385fa98-ad7a-4fd2-8cfa-5d903f437502
          NETLIFY_DEPLOY_ID: 6ac6e7ad4b90cc0008f7f356
        run: |
          node <<'NODE'
          const token = process.env.NETLIFY_AUTH_TOKEN
          const siteId = process.env.NETLIFY_SITE_ID
          const deployId = process.env.NETLIFY_DEPLOY_ID
          if (!token) throw new Error('NETLIFY_AUTH_TOKEN unavailable')

          const tokenUrl = new URL(
            'https://app.netlify.com/access-control/generate-access-control-token'
          )
          tokenUrl.searchParams.set('deploy_id', deployId)
          tokenUrl.searchParams.set('site_id', siteId)

          const tokenResponse = await fetch(tokenUrl, {
            headers: {
              Authorization: `Bearer ${token}`,
              'Content-Type': 'application/json',
            },
          })
          console.log('NETLIFY_LOG_TOKEN_STATUS=' + tokenResponse.status)
          if (!tokenResponse.ok) process.exit(0)

          const tokenData = await tokenResponse.json()
          const accessToken = tokenData.accessControlToken
          if (!accessToken) {
            console.log('NETLIFY_LOG_TOKEN_MISSING')
            process.exit(0)
          }

          const important = /error|fail|exit|pnpm|npm|node|build|install|tsc|vite|secret|scan|command|package|corepack|typescript|config|dependency/i

          await new Promise((resolve) => {
            const ws = new WebSocket('wss://socketeer.services.netlify.com/build/logs')
            let seen = 0
            const finish = () => {
              try { ws.close() } catch {}
              resolve()
            }
            const timer = setTimeout(finish, 20000)

            ws.addEventListener('open', () => {
              console.log('NETLIFY_LOG_SOCKET_OPEN')
              ws.send(JSON.stringify({
                deploy_id: deployId,
                site_id: siteId,
                access_token: accessToken,
              }))
            })

            ws.addEventListener('message', (event) => {
              try {
                const data = JSON.parse(event.data)
                if (data.type === 'error') {
                  console.log('NETLIFY_LOG_STREAM_ERROR=' + JSON.stringify({
                    status: data.status,
                    message: data.message,
                  }))
                  return
                }
                let message = String(data.message || '')
                message = message
                  .replaceAll(token, '[REDACTED_NETLIFY_TOKEN]')
                  .replaceAll(accessToken, '[REDACTED_LOG_TOKEN]')
                if (important.test(message)) {
                  seen += 1
                  console.log('NETLIFY_BUILD_LOG ' + message.slice(0, 1800))
                }
              } catch {}
            })

            ws.addEventListener('error', () => {
              console.log('NETLIFY_LOG_SOCKET_ERROR')
              clearTimeout(timer)
              resolve()
            })

            ws.addEventListener('close', () => {
              console.log('NETLIFY_LOG_SOCKET_CLOSED seen=' + seen)
              clearTimeout(timer)
              resolve()
            })
          })
          NODE

      - name: Build
        run: pnpm build

      - name: Netlify hosted config diagnostics
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 6385fa98-ad7a-4fd2-8cfa-5d903f437502
          NETLIFY_ACCOUNT_ID: 68a5094671bba3abf89c3983
        run: |
          node <<'NODE'
          const token = process.env.NETLIFY_AUTH_TOKEN
          const siteId = process.env.NETLIFY_SITE_ID
          const accountId = process.env.NETLIFY_ACCOUNT_ID
          if (!token) throw new Error('NETLIFY_AUTH_TOKEN unavailable')
          const headers = { Authorization: `Bearer ${token}` }
          const getJson = async (url) => {
            const response = await fetch(url, { headers })
            if (!response.ok) throw new Error(`Netlify API ${response.status}`)
            return response.json()
          }
          const site = await getJson(`https://api.netlify.com/api/v1/sites/${siteId}`)
          const build = site.build_settings || {}
          console.log('NETLIFY_SAFE_SITE_CONFIG=' + JSON.stringify({
            repo_branch: build.repo_branch || null,
            build_command: build.cmd || null,
            base: build.base || null,
            publish: build.dir || null,
            provider: build.provider || null,
          }))
          for (const key of ['PNPM_FLAGS', 'NODE_VERSION']) {
            try {
              const item = await getJson(
                `https://api.netlify.com/api/v1/accounts/${accountId}/env/${encodeURIComponent(key)}?site_id=${siteId}`
              )
              console.log(`NETLIFY_ENV_${key}=` + JSON.stringify({
                scopes: item?.scopes || [],
                values: (item?.values || []).map((v) => ({
                  context: v.context,
                  value: v.value,
                })),
                is_secret: Boolean(item?.is_secret),
              }))
            } catch {
              console.log(`NETLIFY_ENV_${key}=not_set_or_unavailable`)
            }
          }
          NODE
