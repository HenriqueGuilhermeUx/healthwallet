name: Concierge Digital AI CI

on:
  push:
    branches:
      - feature/concierge-digital-ai-v1
  pull_request:
    paths:
      - 'SQL_CONCIERGE_DIGITAL_AI_V1.sql'
      - 'netlify/functions/concierge-digital-ai.js'
      - 'src/pages/ConciergeDigital.tsx'
      - 'src/pages/Concierge.tsx'
      - 'src/App.tsx'
      - '.github/workflows/concierge-digital-ai-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Concierge Digital build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'path="/concierge/digital"' src/App.tsx
          grep -q 'concierge_chat_sessions' SQL_CONCIERGE_DIGITAL_AI_V1.sql
          grep -q 'concierge_chat_request_human' SQL_CONCIERGE_DIGITAL_AI_V1.sql
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' netlify/functions/concierge-digital-ai.js
          grep -q 'gpt-6-luna' netlify/functions/concierge-digital-ai.js
          grep -q 'Falar com uma pessoa' src/pages/ConciergeDigital.tsx
      - name: Build
        run: pnpm build

      - name: Diagnose hosted Netlify deploy
        if: always()
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 6385fa98-ad7a-4fd2-8cfa-5d903f437502
        run: |
          set +e
          echo "=== latest site builds ==="
          curl -fsS             -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}"             "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/builds?per_page=5"             | jq '[.[] | {id, deploy_id, sha, done, error, created_at}]'
          echo "=== latest PR deploy metadata ==="
          curl -fsS             -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}"             "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys?per_page=10"             | jq '[.[] | select(.context=="deploy-preview") | {id, build_id, state, error_message, branch, commit_ref, created_at}] | .[:5]'
          echo "=== site env metadata (values intentionally omitted) ==="
          curl -fsS             -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}"             "https://api.netlify.com/api/v1/accounts/68a5094671bba3abf89c3983/env?site_id=${NETLIFY_SITE_ID}"             | jq '[.[] | {key, is_secret, scopes, contexts: [.values[]?.context]}] | sort_by(.key)'

      - name: Netlify parity build
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 6385fa98-ad7a-4fd2-8cfa-5d903f437502
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}" || { echo 'NETLIFY_AUTH_TOKEN unavailable'; exit 2; }
          npx --yes netlify-cli@27.8.0 build --context deploy-preview


