name: Health Concierge Validation Contract

on:
  push:
    branches:
      - feature/health-concierge-mvp
    paths:
      - 'SQL_CONCIERGE_*.sql'
      - 'HEALTH_CONCIERGE_VALIDATION.md'
      - 'HEALTH_CONCIERGE_E2E_RUNBOOK.md'
      - 'HEALTH_CONCIERGE_PILOT_ROLLOUT.md'
      - '.github/workflows/health-concierge-validation-contract.yml'
      - '.github/workflows/health-concierge-pilot-bootstrap.yml'
  workflow_dispatch:

jobs:
  validation-contract:
    name: Validate Concierge release contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required validation artifacts
        run: |
          set -euo pipefail
          for file in \
            SQL_CONCIERGE_PILOT_COMPAT_V1.sql \
            SQL_CONCIERGE_MVP_V1.sql \
            SQL_CONCIERGE_PILOT_ANALYTICS_V1.sql \
            SQL_CONCIERGE_AUTOMATION_GUARDS_V1.sql \
            SQL_CONCIERGE_CONSENT_V1.sql \
            SQL_CONCIERGE_ROSTER_GUARDS_V1.sql \
            SQL_CONCIERGE_REQUEST_INTEGRITY_V1.sql \
            SQL_CONCIERGE_PROGRAM_GUARDS_V1.sql \
            SQL_CONCIERGE_ALERT_ENGINE_V1.sql \
            SQL_CONCIERGE_ALERT_CONSENT_GUARD_V1.sql \
            SQL_CONCIERGE_CLINICAL_REVIEW_V1.sql \
            SQL_CONCIERGE_REQUEST_CONTEXT_V1.sql \
            SQL_CONCIERGE_PATIENT_AUDIT_V1.sql \
            SQL_CONCIERGE_SLA_METRICS_V1.sql \
            SQL_CONCIERGE_PATIENT_REPLY_ROUTING_V1.sql \
            SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql \
            SQL_CONCIERGE_VALIDATION_PRECHECK_V1.sql \
            SQL_CONCIERGE_VALIDATION_SEED_V1.sql \
            SQL_CONCIERGE_VALIDATION_POSTCHECK_V1.sql \
            HEALTH_CONCIERGE_VALIDATION.md \
            HEALTH_CONCIERGE_E2E_RUNBOOK.md \
            HEALTH_CONCIERGE_PILOT_ROLLOUT.md \
            .github/workflows/health-concierge-pilot-bootstrap.yml
          do
            test -f "$file" || { echo "Missing required validation artifact: $file"; exit 1; }
          done

      - name: Canonical migration order audit
        run: |
          node <<'NODE'
          const fs = require('fs')
          const docs = [
            fs.readFileSync('HEALTH_CONCIERGE_VALIDATION.md', 'utf8'),
            fs.readFileSync('HEALTH_CONCIERGE_E2E_RUNBOOK.md', 'utf8'),
          ]
          const migrations = [
            'SQL_CONCIERGE_MVP_V1.sql',
            'SQL_CONCIERGE_PILOT_ANALYTICS_V1.sql',
            'SQL_CONCIERGE_AUTOMATION_GUARDS_V1.sql',
            'SQL_CONCIERGE_CONSENT_V1.sql',
            'SQL_CONCIERGE_ROSTER_GUARDS_V1.sql',
            'SQL_CONCIERGE_REQUEST_INTEGRITY_V1.sql',
            'SQL_CONCIERGE_PROGRAM_GUARDS_V1.sql',
            'SQL_CONCIERGE_ALERT_ENGINE_V1.sql',
            'SQL_CONCIERGE_ALERT_CONSENT_GUARD_V1.sql',
            'SQL_CONCIERGE_CLINICAL_REVIEW_V1.sql',
            'SQL_CONCIERGE_REQUEST_CONTEXT_V1.sql',
            'SQL_CONCIERGE_PATIENT_AUDIT_V1.sql',
            'SQL_CONCIERGE_SLA_METRICS_V1.sql',
            'SQL_CONCIERGE_PATIENT_REPLY_ROUTING_V1.sql',
            'SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql',
          ]

          for (const [docIndex, text] of docs.entries()) {
            let previous = -1
            for (const file of migrations) {
              const index = text.indexOf(file)
              if (index < 0) throw new Error(`Doc ${docIndex + 1} missing ${file}`)
              if (index <= previous) throw new Error(`Doc ${docIndex + 1} migration order broken at ${file}`)
              previous = index
            }
          }
          console.log('Canonical 15-migration order is preserved in validation docs.')
          NODE

      - name: Reference-team routing safety audit
        run: |
          set -euo pipefail
          grep -q 'concierge_route_reference_team' SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql
          grep -q 'trg_10_concierge_reference_team_route' SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql
          grep -q 'trg_20_concierge_guard_clinician_assignment' SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql
          grep -q "a.is_primary = true" SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql
          grep -q "a.role IN ('nurse','care_coordinator')" SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql
          grep -q "a.role = 'doctor'" SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql
          grep -q 'Nurse cannot assign an arbitrary physician' SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql
          grep -q 'Doctor cannot change nursing assignment' SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql
          grep -q 'concierge_reference_team' SQL_CONCIERGE_VALIDATION_PRECHECK_V1.sql

      - name: Data API privilege contract audit
        run: |
          set -euo pipefail
          grep -q 'EXPLICIT DATA API PRIVILEGES' SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql
          grep -q 'FROM anon' SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql
          grep -q 'FROM authenticated' SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql
          grep -q 'GRANT SELECT ON TABLE public.concierge_staff TO authenticated' SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql
          grep -q 'public.concierge_requests' SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql
          grep -q 'public.concierge_clinical_reviews' SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql
          grep -q 'Authenticated Data API privilege mismatch' SQL_CONCIERGE_VALIDATION_PRECHECK_V1.sql
          grep -q 'Anonymous Data API privilege present' SQL_CONCIERGE_VALIDATION_PRECHECK_V1.sql
          if grep -Eq 'GRANT[[:space:]]+ALL.*authenticated' SQL_CONCIERGE_REFERENCE_TEAM_ROUTING_V1.sql; then
            echo 'Concierge Data API grants must remain operation-specific, not GRANT ALL.'
            exit 1
          fi

      - name: Synthetic persona isolation audit
        run: |
          set -euo pipefail
          grep -q 'VALIDATION ENVIRONMENT ONLY' SQL_CONCIERGE_VALIDATION_SEED_V1.sql
          grep -q 'NEVER RUN IN PRODUCTION' SQL_CONCIERGE_VALIDATION_SEED_V1.sql
          grep -q '@healthwallet.test' SQL_CONCIERGE_VALIDATION_SEED_V1.sql
          grep -q 'Refusing to reseed a used E2E environment' SQL_CONCIERGE_VALIDATION_SEED_V1.sql
          grep -q "consent_status = 'pending'" SQL_CONCIERGE_VALIDATION_SEED_V1.sql
          grep -q 'Patient A -> Nurse A + Doctor A' SQL_CONCIERGE_VALIDATION_SEED_V1.sql

      - name: Precheck and postcheck contract audit
        run: |
          set -euo pipefail
          grep -q "'PASS' AS validation_precheck" SQL_CONCIERGE_VALIDATION_PRECHECK_V1.sql
          grep -q 'Unrestricted policy found' SQL_CONCIERGE_VALIDATION_PRECHECK_V1.sql
          grep -q 'RLS disabled on' SQL_CONCIERGE_VALIDATION_PRECHECK_V1.sql
          grep -q 'reference-team routing' SQL_CONCIERGE_VALIDATION_PRECHECK_V1.sql
          grep -q "'PASS' AS canonical_e2e_postcheck" SQL_CONCIERGE_VALIDATION_POSTCHECK_V1.sql
          grep -q 'Patient A latest request did not remain routed to Nurse A' SQL_CONCIERGE_VALIDATION_POSTCHECK_V1.sql
          grep -q 'Patient A medical escalation did not route to Doctor A' SQL_CONCIERGE_VALIDATION_POSTCHECK_V1.sql
          grep -q 'Patient A still has open Concierge alerts after consent revocation' SQL_CONCIERGE_VALIDATION_POSTCHECK_V1.sql

      - name: Pilot compatibility audit
        run: |
          set -euo pipefail
          grep -q 'STAGING / PILOT ENVIRONMENT ONLY' SQL_CONCIERGE_PILOT_COMPAT_V1.sql
          grep -q 'ADD COLUMN IF NOT EXISTS target_family_member_id' SQL_CONCIERGE_PILOT_COMPAT_V1.sql
          grep -q 'ADD COLUMN IF NOT EXISTS requires_confirmation' SQL_CONCIERGE_PILOT_COMPAT_V1.sql
          grep -q 'ADD COLUMN IF NOT EXISTS updated_at' SQL_CONCIERGE_PILOT_COMPAT_V1.sql
          grep -q 'idx_health_reminders_target_family_member' SQL_CONCIERGE_PILOT_COMPAT_V1.sql
          if grep -Eq 'INSERT[[:space:]]+INTO|CREATE[[:space:]]+TABLE[[:space:]]+public\.concierge_' SQL_CONCIERGE_PILOT_COMPAT_V1.sql; then
            echo 'Pilot compatibility file must not seed data or create Concierge operational tables.'
            exit 1
          fi

      - name: Pilot bootstrap isolation audit
        run: |
          set -euo pipefail
          workflow='.github/workflows/health-concierge-pilot-bootstrap.yml'
          grep -q 'workflow_dispatch' "$workflow"
          grep -q 'BOOTSTRAP PILOT ONLY' "$workflow"
          grep -q 'HEALTHWALLET_PRODUCTION_PROJECT_REF' "$workflow"
          grep -q 'CONCIERGE_PILOT_DB_URL' "$workflow"
          grep -q 'REFUSED: target project ref is the HealthWallet production project' "$workflow"
          grep -q 'Target contains auth/patient/health rows' "$workflow"
          grep -q 'Existing Concierge tables found' "$workflow"
          grep -q 'SQL_CONCIERGE_PILOT_COMPAT_V1.sql' "$workflow"
          grep -q 'SQL_CONCIERGE_VALIDATION_PRECHECK_V1.sql' "$workflow"
          grep -q 'No validation personas were created' "$workflow"

          if grep -q 'SQL_CONCIERGE_VALIDATION_BASE_V1.sql' "$workflow"; then
            echo 'Remote pilot bootstrap must never install the synthetic validation base schema.'
            exit 1
          fi
          if grep -q 'SQL_CONCIERGE_VALIDATION_SEED_V1.sql' "$workflow"; then
            echo 'Remote pilot bootstrap must never seed validation personas.'
            exit 1
          fi
          if grep -q 'SQL_CONCIERGE_VALIDATION_SESSION_DIAGNOSTICS_V1.sql' "$workflow"; then
            echo 'Remote pilot bootstrap must never install validation-only diagnostics.'
            exit 1
          fi
          if grep -Eq 'supabase[[:space:]]+link|supabase[[:space:]]+db[[:space:]]+push|--linked' "$workflow"; then
            echo 'Remote pilot bootstrap must use the explicitly bound pilot DB URL only.'
            exit 1
          fi

      - name: Pilot rollout documentation audit
        run: |
          set -euo pipefail
          doc='HEALTH_CONCIERGE_PILOT_ROLLOUT.md'
          grep -q 'Data-free staging schema' "$doc"
          grep -q 'Controlled human smoke test' "$doc"
          grep -q 'Production database security hardening' "$doc"
          grep -q 'Explicit production pilot approval' "$doc"
          grep -q 'Do not put real patient data' "$doc"
          grep -q 'automation_events.*not required' "$doc"
          grep -q 'NO-GO for production migration or real-patient rollout yet' "$doc"

      - name: E2E release gate audit
        run: |
          set -euo pipefail
          grep -q 'Patient A -> Nurse A -> Doctor A -> Patient A' HEALTH_CONCIERGE_E2E_RUNBOOK.md
          grep -q 'Consent revocation kill switch' HEALTH_CONCIERGE_E2E_RUNBOOK.md
          grep -q 'Role / privacy negative controls' HEALTH_CONCIERGE_E2E_RUNBOOK.md
          grep -q 'Existing HealthWallet regression pass' HEALTH_CONCIERGE_E2E_RUNBOOK.md
          grep -q '15 migrations apply cleanly' HEALTH_CONCIERGE_E2E_RUNBOOK.md
          grep -q 'Any failed item is \*\*NO-GO\*\*' HEALTH_CONCIERGE_E2E_RUNBOOK.md

      - name: Production isolation statement
        run: |
          echo 'Validation contract passed.'
          echo 'No database migration, production deployment or branch merge is performed by this workflow.'
