name: HealthWallet Connect Side-by-Side Test

on:
  push:
    branches:
      - feature/healthwallet-connect
    paths:
      - 'capacitor.config.ts'
      - 'src/**'
      - 'scripts/patch-capacitor-android.mjs'
      - 'scripts/patch-health-permissions.mjs'
      - 'scripts/patch-healthwallet-connect-return.mjs'
      - '.github/workflows/healthwallet-connect-side-by-side.yml'
  workflow_dispatch:

concurrency:
  group: healthwallet-connect-side-by-side-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-healthwallet-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36"

      - name: Check runtime configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing VITE_SUPABASE_URL" && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "Missing VITE_SUPABASE_ANON_KEY" && exit 1)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build HealthWallet web app
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_NEXA_LOGIN: 'false'

      - name: Add Android project as side-by-side test variant
        run: npx cap add android
        env:
          HEALTHWALLET_TEST_VARIANT: 'true'

      - name: Sync Android project as side-by-side test variant
        run: npx cap sync android
        env:
          HEALTHWALLET_TEST_VARIANT: 'true'

      - name: Patch Android test build
        run: |
          node scripts/patch-capacitor-android.mjs
          node scripts/patch-health-permissions.mjs
          node scripts/patch-healthwallet-connect-return.mjs

      - name: Audit side-by-side identity and links
        shell: bash
        run: |
          grep -q 'applicationId "br.com.healthwallet.app.connecttest"' android/app/build.gradle || (echo "Side-by-side applicationId missing" && exit 1)
          grep -q 'android:scheme="healthwallet" android:host="connect-complete"' android/app/src/main/AndroidManifest.xml || (echo "HealthWallet return scheme missing" && exit 1)
          grep -q '<data android:scheme="healthwallet-connect" />' android/app/src/main/AndroidManifest.xml || (echo "Connect target query missing" && exit 1)
          grep -q 'HealthWallet Test' android/app/src/main/res/values/strings.xml || (echo "HealthWallet Test label missing" && exit 1)
          echo "Side-by-side identity and app links passed."

      - name: Build HealthWallet Test debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Audit HealthWallet Test Health Connect permissions
        shell: bash
        run: |
          MERGED_MANIFEST="$(find android/app/build/intermediates -path '*merged*manifest*' -name AndroidManifest.xml | head -n 1)"
          test -n "$MERGED_MANIFEST" || (echo "Merged AndroidManifest.xml not found" && exit 1)
          grep -q 'android.permission.health.READ_STEPS' "$MERGED_MANIFEST" || (echo "READ_STEPS missing" && exit 1)
          EXTRA="$(grep -oE 'android\.permission\.health\.[A-Z_]+' "$MERGED_MANIFEST" | sort -u | grep -v '^android.permission.health.READ_STEPS$' || true)"
          if [ -n "$EXTRA" ]; then
            echo "Unexpected Health Connect permissions in HealthWallet Test APK:"
            echo "$EXTRA"
            exit 1
          fi
          echo "HealthWallet Test permission audit passed: READ_STEPS only."

      - name: Upload side-by-side HealthWallet Test APK
        uses: actions/upload-artifact@v4
        with:
          name: healthwallet-connect-side-by-side-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
