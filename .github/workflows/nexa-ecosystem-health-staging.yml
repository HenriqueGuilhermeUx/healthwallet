name: Nexa Ecosystem Health Staging

on:
  push:
    branches:
      - 'feature/nexa-attention-feed'
    paths:
      - 'netlify/functions/nexa-attention.mjs'
      - 'netlify/functions/nexa-session.mjs'
      - 'src/hooks/useAuth.tsx'
      - 'src/pages/Login.tsx'
      - 'src/App.tsx'
      - '.github/workflows/nexa-ecosystem-health-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexa-ecosystem-health-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_SITE_ID: 6385fa98-ad7a-4fd2-8cfa-5d903f437502
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN || secrets.NETLIFY_ACCESS_TOKEN || secrets.NETLIFY_API_TOKEN }}
      NEXA_API_URL: https://nexa-backend-wallet-v15-staging.onrender.com/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Require Netlify credential
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}" || {
            echo 'Netlify token missing in GitHub secrets.'
            exit 2
          }

      - name: Verify staging secrets without printing values
        run: |
          set -euo pipefail
          npx -y netlify-cli@latest env:list             --site "$NETLIFY_SITE_ID"             --auth "$NETLIFY_AUTH_TOKEN"             --json > /tmp/netlify-env.json

          echo 'Health Supabase URL configuration:'
          jq -c '.. | objects | select(.key? == "VITE_SUPABASE_URL" or .key? == "SUPABASE_URL")' /tmp/netlify-env.json || true

          grep -q '"SUPABASE_SERVICE_ROLE_KEY"' /tmp/netlify-env.json || {
            echo 'Missing SUPABASE_SERVICE_ROLE_KEY on isolated healthwallet1 staging site.'
            exit 3
          }

          grep -Eq '"(SUPABASE_URL|VITE_SUPABASE_URL)"' /tmp/netlify-env.json || {
            echo 'Missing Supabase URL on isolated healthwallet1 staging site.'
            exit 4
          }

          echo 'Required Health staging secrets are present.'

      - name: Enable Nexa integration only on staging site
        run: |
          set -euo pipefail
          npx -y netlify-cli@latest env:set NEXA_ECOSYSTEM_ATTENTION_ENABLED true             --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
          npx -y netlify-cli@latest env:set NEXA_ID_SSO_ENABLED true             --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
          npx -y netlify-cli@latest env:set NEXA_API_URL "$NEXA_API_URL"             --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"

      - name: Build Health Wallet
        run: pnpm build

      - name: Deploy isolated draft
        id: netlify
        run: |
          set -euo pipefail
          npx -y netlify-cli@latest deploy             --build             --site "$NETLIFY_SITE_ID"             --auth "$NETLIFY_AUTH_TOKEN"             --message "Nexa ecosystem staging ${GITHUB_SHA}"             --json > /tmp/netlify-deploy.json

          DEPLOY_URL="$(jq -r '.deploy_url // .deploy_ssl_url // empty' /tmp/netlify-deploy.json)"
          test -n "$DEPLOY_URL"
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Health staging draft: $DEPLOY_URL"

      - name: Smoke isolated staging
        run: |
          set -euo pipefail
          BASE='${{ steps.netlify.outputs.deploy_url }}'

          curl --fail --silent --show-error --location "$BASE/healthwallet" > /tmp/healthwallet.html
          grep -qi '<div id="root"' /tmp/healthwallet.html

          STATUS="$(curl --silent --output /tmp/attention.json --write-out '%{http_code}'             -H 'X-Nexa-User-ID: staging-smoke'             "$BASE/api/nexa/attention")"
          test "$STATUS" = '401'

          echo "PASS: isolated Health Wallet staging + protected Nexa attention endpoint."
