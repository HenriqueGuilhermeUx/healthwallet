[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  PNPM_FLAGS = "--no-frozen-lockfile"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/analyze-exam"
  to = "/.netlify/functions/analyze-exam"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
